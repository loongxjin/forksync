<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForkSync</title>
    <!-- Synchronous theme init to prevent FOUC (flash of unstyled content) -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('forksync-theme')
          if (theme !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
