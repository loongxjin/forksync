name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Wails CLI
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # Sync version from git tag (v0.6.0 → 0.6.0) into frontend/package.json
      - name: Sync version from git tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          cd frontend
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      # Build frontend + Go binary via Wails
      - name: Build Wails app
        run: wails build -clean

      # macOS: package as DMG with drag-to-Applications layout
      - name: Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          chmod +x build/dmg.sh
          bash build/dmg.sh "$TAG_VERSION"

      # Windows: build NSIS installer
      - name: Package NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          choco install nsis -y --no-progress 2>/dev/null || true
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          makensis -DVERSION="${TAG_VERSION}" build/windows/installer.nsi

      # Upload artifacts to GitHub Release
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*.dmg
            build/bin/*.exe
            build/bin/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
