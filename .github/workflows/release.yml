name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-wails:
    name: Release Desktop App (Wails)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: "*.dmg"
          - os: ubuntu-latest
            artifact: "*.AppImage,*.deb"
          - os: windows-latest
            artifact: "*.exe,*.msi"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install system deps for Wails on Linux
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Wails app
        uses: dAppServer/wails-build-action@v2

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/${{ matrix.artifact }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
